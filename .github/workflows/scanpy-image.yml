name: Build Scanpy image

on:
  push:
    tags:
      - 'scanpy-v*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag
        required: true
        default: '1.12.4-1'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag='${{ inputs.image_tag }}'
          else
            tag="${GITHUB_REF_NAME#scanpy-v}"
          fi
          [[ -n "$tag" ]] || { echo "empty image tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Scanpy runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/scanpy/Dockerfile
          push: true
          tags: ghcr.io/stela2502/norn-scanpy:${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
